name: hello world
description: hello!

on: [push]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - uses: actions/checkout@v6
      - name: List files on runner
        run: | 
          cd .. 
          ls -R .
      - id: foo
        uses: yarynots/myreactcoreapp/.github/actions/action@main
        with:
          who-to-greet: 'Mona the pretty Octocat'
      - run: echo random-number "$RANDOM_NUMBER"
        shell: bash
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}
