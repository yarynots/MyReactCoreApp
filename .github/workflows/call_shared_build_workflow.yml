name: build solution
description: use reusable workflow to build solution

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  
  call-reusable-build-job:
    uses: YarynotsOrg/shared-workflows/.github/workflows/reusable-build.yml@main
    with:
      the-solution: ReactApp1.slnx
    secrets:
      azure-profile: ${{ secrets.AZURE_SECRET }}
      
  send-slack-message:
    runs-on: ubuntu-latest
    needs: call-reusable-build-job
    
    steps:
    
      - name: send slack message
        uses: slackapi/slack-github-action@v4
        
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "howdy <!channel>!"
